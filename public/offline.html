<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gita AI - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0618 0%, #160b2e 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .icon-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px auto;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(249, 115, 22, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(249, 115, 22, 0.4); }
        }

        .icon-container svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(to right, #ea580c, #f59e0b);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Decorative Stars */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Decorative Stars -->
    <div class="star" style="top: 10%; left: 20%; width: 4px; height: 4px;"></div>
    <div class="star" style="top: 20%; right: 15%; width: 6px; height: 6px; animation-delay: 1s;"></div>
    <div class="star" style="bottom: 15%; left: 10%; width: 5px; height: 5px; animation-delay: 2s;"></div>
    <div class="star" style="bottom: 25%; right: 20%; width: 3px; height: 3px; animation-delay: 0.5s;"></div>

    <div class="container">
        <div class="icon-container">
            <!-- Wi-Fi Off Icon -->
            <svg viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>You are Offline</h1>
        <p>It seems you have lost your internet connection. Please check your network and try again to connect with our Astrologers.</p>

        <button class="btn" onclick="window.location.reload()">
            Retry Connection
        </button>
    </div>

</body>
</html>
